<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外贸单证自动生成系统</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --primary: #e94560;
  --accent: #00d2ff;
  --text: #eaeaea;
  --text2: #a0a0b0;
  --border: #2a2a4a;
  --input-bg: #1e1e36;
  --table-hd: #0f3460;
  --success: #00c853;
  --warning: #ff9100;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* === 顶部栏 === */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar h1 { font-size: 18px; color: var(--accent); }
.topbar .subtitle { font-size: 12px; color: var(--text2); margin-left: 8px; }
.topbar .actions { display: flex; gap: 8px; }
.btn {
  padding: 7px 16px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); color: var(--text); cursor: pointer;
  font-size: 13px; transition: all .2s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
.btn-accent { background: transparent; border-color: var(--accent); color: var(--accent); }
.btn-accent:hover { background: var(--accent); color: #000; }
.btn-success { background: var(--success); border-color: var(--success); color: #000; }
.btn-success:hover { opacity: 0.85; color: #000; }

/* === 主布局 === */
.main-layout {
  display: flex; height: calc(100vh - 56px);
}
.left-panel {
  width: 480px; min-width: 380px; background: var(--surface);
  border-right: 1px solid var(--border); overflow-y: auto;
  display: flex; flex-direction: column;
}
.right-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}

/* === 左侧表单 === */
.form-scroll { padding: 12px; flex: 1; overflow-y: auto; }
.collapse-section { margin-bottom: 6px; }
.collapse-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--surface2); border-radius: 6px;
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: background .2s;
}
.collapse-header:hover { background: #1a4a80; }
.collapse-header .arrow { transition: transform .2s; font-size: 10px; }
.collapse-header.open .arrow { transform: rotate(90deg); }
.collapse-body { padding: 10px 4px; display: none; }
.collapse-body.show { display: block; }
.form-row {
  display: flex; gap: 8px; margin-bottom: 8px; align-items: center;
}
.form-row.col2 > * { width: 50%; }
.form-row.col3 > * { width: 33.33%; }
.form-group { flex: 1; }
.form-group label {
  display: block; font-size: 11px; color: var(--text2); margin-bottom: 3px;
  font-weight: 500;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 7px 10px; background: var(--input-bg);
  border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 12px; outline: none; transition: border .2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
}
.form-group textarea { resize: vertical; min-height: 48px; font-family: inherit; }

/* 货物明细表格 */
.items-table-wrap { overflow-x: auto; margin: 8px 0; }
.items-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
  min-width: 750px;
}
.items-table th {
  background: var(--table-hd); padding: 6px 4px; border: 1px solid var(--border);
  color: var(--accent); font-size: 10px; position: sticky; top: 0;
}
.items-table td { padding: 2px; border: 1px solid var(--border); }
.items-table input {
  width: 100%; padding: 4px 5px; background: var(--input-bg);
  border: none; color: var(--text); font-size: 11px; outline: none;
  min-width: 50px;
}
.items-table input:focus { background: #2a2a50; }
.items-table .w40 { min-width: 40px; width: 40px; }
.items-table .w60 { min-width: 60px; width: 60px; }
.items-table .w80 { min-width: 80px; width: 80px; }
.items-table .w100 { min-width: 100px; width: 100px; }
.items-table .w120 { min-width: 120px; }
.item-row-remove {
  background: none; border: none; color: var(--primary); cursor: pointer;
  font-size: 16px; padding: 2px 6px;
}
.item-row-remove:hover { color: #ff5252; }

/* === 右侧预览 === */
.preview-tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  overflow-x: auto; flex-shrink: 0;
}
.preview-tab {
  padding: 10px 16px; font-size: 12px; white-space: nowrap; cursor: pointer;
  border: none; background: none; color: var(--text2);
  border-bottom: 2px solid transparent; transition: all .2s;
}
.preview-tab:hover { color: var(--text); }
.preview-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.preview-content {
  flex: 1; overflow-y: auto; padding: 20px; background: #f5f5f5;
  display: flex; justify-content: center;
}
.preview-frame {
  width: 210mm; min-height: 297mm; background: #fff; box-shadow: 0 2px 20px rgba(0,0,0,.15);
  position: relative;
}
.preview-frame iframe {
  width: 100%; height: 100%; border: none; min-height: 297mm;
}
.preview-actions {
  display: flex; gap: 8px; padding: 10px 20px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0;
}

/* Toast */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  padding: 12px 20px; border-radius: 6px; font-size: 13px;
  animation: slideIn .3s ease;
  max-width: 360px;
}
.toast.success { background: #1b5e20; color: #a5d6a7; border: 1px solid #2e7d32; }
.toast.error { background: #b71c1c; color: #ef9a9a; border: 1px solid #c62828; }
.toast.info { background: #0d47a1; color: #90caf9; border: 1px solid #1565c0; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* 打印样式 */
@media print {
  body { background: #fff; }
  .topbar, .left-panel, .preview-tabs, .preview-actions { display: none !important; }
  .main-layout { display: block; height: auto; }
  .right-panel { overflow: visible; }
  .preview-content { padding: 0; }
  .preview-frame { box-shadow: none; width: 100%; }
}

/* 响应式 */
@media (max-width: 900px) {
  .main-layout { flex-direction: column; }
  .left-panel { width: 100%; min-width: 0; max-height: 40vh; }
  .preview-frame { width: 100%; }
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div>
    <h1 style="display:inline;">📦 外贸单证自动生成系统</h1>
    <span class="subtitle">Trade Document Generator v1.0</span>
  </div>
  <div class="actions">
    <button class="btn" onclick="loadSampleData()">📋 加载示例数据</button>
    <button class="btn" onclick="clearAllData()">🗑 清空数据</button>
    <button class="btn btn-accent" onclick="exportAllPDF()">📥 导出全部 PDF</button>
  </div>
</div>

<!-- 主布局 -->
<div class="main-layout">

  <!-- 左侧表单 -->
  <div class="left-panel">
    <div class="form-scroll" id="formContainer">
      <!-- 动态生成 -->
    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="right-panel">
    <div class="preview-tabs" id="previewTabs">
      <!-- 动态生成 -->
    </div>
    <div class="preview-content" id="previewContent">
      <div class="preview-frame" id="previewFrame">
        <iframe id="previewIframe"></iframe>
      </div>
    </div>
    <div class="preview-actions">
      <span style="font-size:12px;color:var(--text2);margin-right:auto;line-height:32px;">💡 提示：表单数据自动保存，修改后实时预览</span>
      <button class="btn" onclick="printCurrentDoc()">🖨 打印当前文档</button>
      <button class="btn btn-success" onclick="downloadCurrentPDF()">📄 下载为 PDF</button>
    </div>
  </div>
</div>

<script>
// ==================== 工具函数 ====================
function fmtMoney(num, currency, symbol) {
  const s = symbol || currency || '';
  const n = Number(num);
  if (isNaN(n)) return '';
  return s + ' ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function sum(arr, key) { return arr.reduce((acc, it) => acc + (Number(it[key]) || 0), 0); }
function numberToChinese(num) {
  const digits = ['零', '壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖'];
  const units = ['', '拾', '佰', '仟', '万', '拾', '佰', '仟', '亿'];
  let n = Math.round(num * 100);
  if (n === 0) return '零元整';
  const yuan = Math.floor(n / 100);
  const jiao = Math.floor((n % 100) / 10);
  const fen = n % 10;
  let result = '';
  if (yuan > 0) {
    let s = String(yuan);
    let zero = false;
    for (let i = 0; i < s.length; i++) {
      const d = parseInt(s[i]);
      const pos = s.length - i - 1;
      if (d === 0) { zero = true; }
      else {
        if (zero) { result += '零'; zero = false; }
        result += digits[d] + units[pos % units.length];
      }
    }
    result += '元';
  }
  if (jiao === 0 && fen === 0) { result += '整'; }
  else {
    if (jiao > 0) result += digits[jiao] + '角';
    else result += '零';
    if (fen > 0) result += digits[fen] + '分';
  }
  return result;
}

// ==================== 数据管理 ====================
const STORAGE_KEY = 'trade_docs_data';
const DEFAULT_DATA = {
  seller: { name: '', nameEn: '', address: '', addressEn: '', contact: '', phone: '', taxId: '', bankName: '', bankAccount: '', bankSwift: '' },
  buyer: { name: '', nameEn: '', address: '', addressEn: '', contact: '', phone: '', taxId: '' },
  order: { contractNo: '', invoiceNo: '', piNo: '', date: '', incoterms: 'FOB', paymentTerms: 'T/T 30% deposit, 70% against B/L copy', currency: 'USD', currencySymbol: '$', portOfLoading: '', portOfDischarge: '', vesselVoyage: '', etd: '', eta: '', transportMode: 'BY SEA', finalDestination: '', tradeCountry: '' },
  items: [{ hsCode: '', description: '', descriptionEn: '', specs: '', qty: '', unit: 'PCS', unitPrice: '', totalPrice: '', netWeight: '', grossWeight: '', packages: '1', packageType: 'CTNS', volume: '' }],
  declaration: { customsNo: '', originPlace: '', exemptionMethod: '照章征税', containerNo: '', containerType: '40HQ', containerQty: '1' },
  insurance: { insuredParty: '', insuranceAmount: '', insuranceRate: '0.15', insurancePremium: '', coverageType: 'ALL RISKS (一切险) + WAR RISKS (战争险)' },
  notes: { specialRequirements: '', productType: 'general', certifications: '' }
};

function getData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      return deepMerge(DEFAULT_DATA, saved);
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function deepMerge(target, source) {
  const result = JSON.parse(JSON.stringify(target));
  for (const key in source) {
    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      result[key] = deepMerge(result[key] || {}, source[key]);
    } else {
      result[key] = source[key];
    }
  }
  return result;
}

function saveData() {
  const data = collectFormData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function collectFormData() {
  const data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  // 简单收集：从表单中读取
  const getVal = (id) => {
    const el = document.getElementById(id);
    return el ? el.value : '';
  };

  data.seller = {
    name: getVal('seller_name'), nameEn: getVal('seller_nameEn'),
    address: getVal('seller_address'), addressEn: getVal('seller_addressEn'),
    contact: getVal('seller_contact'), phone: getVal('seller_phone'),
    taxId: getVal('seller_taxId'), bankName: getVal('seller_bankName'),
    bankAccount: getVal('seller_bankAccount'), bankSwift: getVal('seller_bankSwift')
  };
  data.buyer = {
    name: getVal('buyer_name'), nameEn: getVal('buyer_nameEn'),
    address: getVal('buyer_address'), addressEn: getVal('buyer_addressEn'),
    contact: getVal('buyer_contact'), phone: getVal('buyer_phone'),
    taxId: getVal('buyer_taxId')
  };
  data.order = {
    contractNo: getVal('order_contractNo'), invoiceNo: getVal('order_invoiceNo'),
    piNo: getVal('order_piNo'), date: getVal('order_date'),
    incoterms: getVal('order_incoterms'), paymentTerms: getVal('order_paymentTerms'),
    currency: getVal('order_currency'), currencySymbol: getVal('order_currencySymbol'),
    portOfLoading: getVal('order_portOfLoading'), portOfDischarge: getVal('order_portOfDischarge'),
    vesselVoyage: getVal('order_vesselVoyage'), etd: getVal('order_etd'),
    eta: getVal('order_eta'), transportMode: getVal('order_transportMode'),
    finalDestination: getVal('order_finalDestination'), tradeCountry: getVal('order_tradeCountry')
  };

  // 货物明细
  const items = [];
  const tbody = document.getElementById('itemsTableBody');
  if (tbody) {
    tbody.querySelectorAll('tr').forEach(row => {
      const getCell = (n) => {
        const input = row.querySelector(`td:nth-child(${n}) input`);
        return input ? input.value : '';
      };
      items.push({
        hsCode: getCell(1), description: getCell(2), descriptionEn: getCell(3),
        specs: getCell(4), qty: getCell(5), unit: getCell(6),
        unitPrice: getCell(7), totalPrice: getCell(8), netWeight: getCell(9),
        grossWeight: getCell(10), packages: getCell(11), packageType: getCell(12),
        volume: getCell(13)
      });
    });
  }
  if (items.length === 0) items.push(JSON.parse(JSON.stringify(DEFAULT_DATA.items[0])));
  data.items = items;

  data.declaration = {
    customsNo: getVal('decl_customsNo'), originPlace: getVal('decl_originPlace'),
    exemptionMethod: getVal('decl_exemptionMethod'), containerNo: getVal('decl_containerNo'),
    containerType: getVal('decl_containerType'), containerQty: getVal('decl_containerQty')
  };
  data.insurance = {
    insuredParty: getVal('ins_insuredParty'), insuranceAmount: getVal('ins_insuranceAmount'),
    insuranceRate: getVal('ins_insuranceRate'), insurancePremium: getVal('ins_insurancePremium'),
    coverageType: getVal('ins_coverageType')
  };
  data.notes = {
    specialRequirements: getVal('notes_specialRequirements'),
    productType: getVal('notes_productType'),
    certifications: getVal('notes_certifications')
  };
  return data;
}

// ==================== 表单渲染 ====================
function renderForm() {
  const data = getData();
  const s = data.seller, b = data.buyer, o = data.order, items = data.items,
        d = data.declaration, ins = data.insurance, n = data.notes;

  let html = '';

  // --- 卖方信息 ---
  html += `<div class="collapse-section">
    <div class="collapse-header open" onclick="toggleCollapse(this)">
      🏢 卖方信息 (Seller)
      <span class="arrow">▶</span>
    </div>
    <div class="collapse-body show">
      <div class="form-row col2">
        <div class="form-group"><label>公司名称（中文）</label><input id="seller_name" value="${esc(s.name)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>Company Name (EN)</label><input id="seller_nameEn" value="${esc(s.nameEn)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col2">
        <div class="form-group"><label>地址（中文）</label><input id="seller_address" value="${esc(s.address)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>Address (EN)</label><input id="seller_addressEn" value="${esc(s.addressEn)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>联系人</label><input id="seller_contact" value="${esc(s.contact)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>电话</label><input id="seller_phone" value="${esc(s.phone)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>统一社会信用代码</label><input id="seller_taxId" value="${esc(s.taxId)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>开户银行</label><input id="seller_bankName" value="${esc(s.bankName)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>银行账号</label><input id="seller_bankAccount" value="${esc(s.bankAccount)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>SWIFT Code</label><input id="seller_bankSwift" value="${esc(s.bankSwift)}" onchange="onFormChange()"></div>
      </div>
    </div>
  </div>`;

  // --- 买方信息 ---
  html += `<div class="collapse-section">
    <div class="collapse-header" onclick="toggleCollapse(this)">
      🌍 买方信息 (Buyer)
      <span class="arrow">▶</span>
    </div>
    <div class="collapse-body">
      <div class="form-row col2">
        <div class="form-group"><label>公司名称（中文）</label><input id="buyer_name" value="${esc(b.name)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>Company Name (EN)</label><input id="buyer_nameEn" value="${esc(b.nameEn)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col2">
        <div class="form-group"><label>地址（中文）</label><input id="buyer_address" value="${esc(b.address)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>Address (EN)</label><input id="buyer_addressEn" value="${esc(b.addressEn)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>联系人</label><input id="buyer_contact" value="${esc(b.contact)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>电话</label><input id="buyer_phone" value="${esc(b.phone)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>纳税人识别号</label><input id="buyer_taxId" value="${esc(b.taxId)}" onchange="onFormChange()"></div>
      </div>
    </div>
  </div>`;

  // --- 订单信息 ---
  html += `<div class="collapse-section">
    <div class="collapse-header open" onclick="toggleCollapse(this)">
      📋 订单信息 (Order Info)
      <span class="arrow">▶</span>
    </div>
    <div class="collapse-body show">
      <div class="form-row col3">
        <div class="form-group"><label>合同号 Contract No.</label><input id="order_contractNo" value="${esc(o.contractNo)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>发票号 Invoice No.</label><input id="order_invoiceNo" value="${esc(o.invoiceNo)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>PI 编号</label><input id="order_piNo" value="${esc(o.piNo)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>日期 Date</label><input type="date" id="order_date" value="${esc(o.date)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>贸易术语 Incoterms</label>
          <select id="order_incoterms" onchange="onFormChange()">
            ${selOpts(['FOB','CIF','CFR','EXW','DDP','DAP','FCA','CIP'], o.incoterms)}
          </select>
        </div>
        <div class="form-group"><label>付款方式 Payment</label><input id="order_paymentTerms" value="${esc(o.paymentTerms)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>币种 Currency</label>
          <select id="order_currency" onchange="onFormChange();updateCurrencySymbol()">
            ${selOpts(['USD','EUR','GBP','CNY','JPY','AUD','CAD'], o.currency)}
          </select>
        </div>
        <div class="form-group"><label>货币符号</label><input id="order_currencySymbol" value="${esc(o.currencySymbol)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>运输方式</label>
          <select id="order_transportMode" onchange="onFormChange()">
            ${selOpts(['BY SEA','BY AIR','BY TRUCK','BY RAIL','EXPRESS'], o.transportMode)}
          </select>
        </div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>起运港 Port of Loading</label><input id="order_portOfLoading" value="${esc(o.portOfLoading)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>目的港 Port of Discharge</label><input id="order_portOfDischarge" value="${esc(o.portOfDischarge)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>船名/航次 Vessel/Voyage</label><input id="order_vesselVoyage" value="${esc(o.vesselVoyage)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row col3">
        <div class="form-group"><label>预计开船日 ETD</label><input type="date" id="order_etd" value="${esc(o.etd)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>预计到港日 ETA</label><input type="date" id="order_eta" value="${esc(o.eta)}" onchange="onFormChange()"></div>
        <div class="form-group"><label>最终目的国 Trade Country</label><input id="order_tradeCountry" value="${esc(o.tradeCountry)}" onchange="onFormChange()"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>最终目的地 Final Destination</label><input id="order_finalDestination" value="${esc(o.finalDestination)}" onchange="onFormChange()"></div>
      </div>
    </div>
  </div>`;

  // --- 货物明细 ---
  html += `<div class="collapse-section">

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selOpts(options, selected) {
  return options.map(o => `<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('');
}

function renderItemsTable(items) {
  const tbody = document.getElementById('itemsTableBody');
  if (!tbody) return;
  let html = '';
  items.forEach((it, i) => {
    html += `<tr>
      <td><input value="${esc(it.hsCode)}" onchange="onFormChange()"></td>
      <td><input value="${esc(it.description)}" onchange="onFormChange()"></td>
      <td><input value="${esc(it.descriptionEn)}" onchange="onFormChange()"></td>
      <td><input value="${esc(it.specs)}" onchange="onFormChange()"></td>
      <td><input value="${esc(it.qty)}" onchange="onFormChange()" style="text-align:right"></td>
      <td><input value="${esc(it.unit)}" onchange="onFormChange()"></td>
      <td><input value="${esc(it.unitPrice)}" onchange="onFormChange()" style="text-align:right"></td>
      <td><input value="${esc(it.totalPrice)}" onchange="onFormChange()" style="text-align:right"></td>
      <td><input value="${esc(it.netWeight)}" onchange="onFormChange()" style="text-align:right"></td>
      <td><input value="${esc(it.grossWeight)}" onchange="onFormChange()" style="text-align:right"></td>
      <td><input value="${esc(it.packages)}" onchange="onFormChange()" style="text-align:right"></td>

function toggleCollapse(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('show');
}

let formChangeTimer;
function onFormChange() {
  clearTimeout(formChangeTimer);
  formChangeTimer = setTimeout(() => {
    saveData();
    refreshPreview();
  }, 300);
}

function addItemRow() {
  const data = getData();
  data.items.push(JSON.parse(JSON.stringify(DEFAULT_DATA.items[0])));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderForm();
  refreshPreview();
}

function removeItemRow(index) {
  const data = getData();
  if (data.items.length <= 1) {
    showToast('至少保留一行货物明细', 'info');
    return;
  }
  data.items.splice(index, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  renderForm();
  refreshPreview();
}

function updateCurrencySymbol() {
  const el = document.getElementById('order_currency');
  const symEl = document.getElementById('order_currencySymbol');
  if (!el || !symEl) return;
  const map = { USD: '$', EUR: '€', GBP: '£', CNY: '¥', JPY: '¥', AUD: 'A$', CAD: 'C$' };
  symEl.value = map[el.value] || el.value;
  onFormChange();
}

// ==================== 文档渲染器注册表 ====================
const DOC_RENDERERS = {
  'packing-list': { title: '📦 装箱单', fn: renderPackingList },
  'customs-decl': { title: '🛃 报关预录单', fn: renderCustomsDeclaration },
  'input-invoice': { title: '🧾 进项发票草稿', fn: renderInputInvoice },
  'logistics-notes': { title: '📋 物流注意事项', fn: renderLogisticsNotes },
  'sales-contract': { title: '📝 销售合同', fn: renderSalesContract },
  'proforma-invoice': { title: '💰 形式发票', fn: renderProformaInvoice },
  'insurance-draft': { title: '🛡 保险预录单', fn: renderInsuranceDraft },
  'other-docs': { title: '📎 其他物流单证', fn: renderOtherDocs }
};

// ==================== 预览切换 ====================
let currentDocKey = 'packing-list';

function renderPreviewTabs() {
  const tabsContainer = document.getElementById('previewTabs');
  tabsContainer.innerHTML = Object.entries(DOC_RENDERERS).map(([key, info]) =>
    `<button class="preview-tab ${key === currentDocKey ? 'active' : ''}" onclick="switchDoc('${key}')">${info.title}</button>`
  ).join('');
}

function switchDoc(key) {
  currentDocKey = key;
  document.querySelectorAll('.preview-tab').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector(`.preview-tab[onclick="switchDoc('${key}')"]`);
  if (tab) tab.classList.add('active');
  refreshPreview();
}

function refreshPreview() {
  const data = getData();
  const renderer = DOC_RENDERERS[currentDocKey];
  if (!renderer) return;
  const html = renderer.fn(data);
  const iframe = document.getElementById('previewIframe');
  iframe.srcdoc = html;
}

// ==================== 导出功能 ====================
function printCurrentDoc() {
  const iframe = document.getElementById('previewIframe');
  iframe.contentWindow.print();
}

function downloadCurrentPDF() {
  showToast('请点击「🖨 打印当前文档」，在打印对话框中选择「另存为 PDF」即可下载', 'info');
  setTimeout(() => printCurrentDoc(), 500);
}

async function exportAllPDF() {
  showToast('正在准备导出全部文档，请在弹出的打印对话框中逐份保存为 PDF...', 'info');
  const keys = Object.keys(DOC_RENDERERS);
  const data = getData();

  for (let i = 0; i < keys.length; i++) {
    const key = keys[i];
    const renderer = DOC_RENDERERS[key];
    const html = renderer.fn(data);
    const iframe = document.getElementById('previewIframe');
    iframe.srcdoc = html;

    await new Promise(resolve => {
      setTimeout(() => {
        iframe.contentWindow.print();
        setTimeout(resolve, 800);
      }, 300);
    });

    if (i < keys.length - 1) {
      showToast(`已发送第 ${i+1}/${keys.length} 份文档（${renderer.title}）到打印机，请在打印对话框中选择「另存为 PDF」`, 'info');
    }
  }
  showToast(`全部 ${keys.length} 份文档已发送打印！每份请手动另存为 PDF`, 'success');
}

// ==================== Toast ====================
function showToast(msg, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

// ==================== 初始化 ====================
function init() {
  renderForm();
  renderPreviewTabs();
  refreshPreview();

  // 监听键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'p') {
        e.preventDefault();
        printCurrentDoc();
      }
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
